name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Install Python quality tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run test suite
        run: tests/run
      - name: Check shell scripts
        run: shellcheck tests/run
      - name: Lint Python
        run: ruff check omawarden-agent.py tests
      - name: Type-check Python
        run: mypy --python-version 3.11 --check-untyped-defs omawarden-agent.py tests/Agent.test.py tests/Manifest.test.py
      - name: Audit Python security
        # External commands are the plugin's purpose and always run as argv,
        # never through a shell; retain every other Bandit rule.
        run: bandit --quiet --recursive omawarden-agent.py --skip B404,B603
